name: AutoGate WebP migration
on:
  push:
    branches: [autogate-webp-update]
    paths: ['.github/workflows/autogate-webp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/autogate-webp-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/migrate-images-webp.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src
          if ! git diff --cached --quiet; then
            git commit -m "Convert storefront images to WebP and update references"
            git push origin HEAD:autogate-webp-update
          fi
