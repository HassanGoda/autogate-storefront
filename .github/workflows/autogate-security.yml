name: AutoGate Security Audit
on:
  push:
    branches: [autogate-webp-update]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit dependency lockfile
        run: |
          mkdir -p audit
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name, flags in [('all', []), ('production', ['--omit=dev'])]:
              r = subprocess.run(['npm','audit','--json','--legacy-peer-deps',*flags], capture_output=True, text=True)
              Path(f'audit/{name}.json').write_text(r.stdout)
              d = json.loads(r.stdout)
              if 'error' in d or 'metadata' not in d:
                  raise RuntimeError(f'Audit unavailable: {name}')
              print(name, d['metadata']['vulnerabilities'])
              for pkg, v in d.get('vulnerabilities', {}).items():
                  print(name, pkg, v.get('severity'), 'direct:', v.get('isDirect'), 'fix:', v.get('fixAvailable'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-reports
          path: audit/
