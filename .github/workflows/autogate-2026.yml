name: AutoGate 2026 Modernization
on:
  push:
    branches: [autogate-security-upgrade]
    paths: ['.github/workflows/autogate-2026.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [core, all]
        node: ['24', 'node']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Resolve stable registry releases
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          mkdir -p modernization-report
          node --version > modernization-report/runtime.txt
          npm --version >> modernization-report/runtime.txt
          python --version >> modernization-report/runtime.txt
          python - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          report={}
          core={'next','react','react-dom','react-redux','next-redux-wrapper','typescript','@types/react','@types/react-dom','@types/node','query-string'}
          for section in ('dependencies','devDependencies'):
              for name, old in d.get(section,{}).items():
                  if os.environ['SCOPE']=='core' and name not in core:
                      continue
                  # Query one field: npm view with several fields can return null/array on newer npm.
                  selector=name+'@latest'
                  if name=='typescript':
                      selector='typescript@^5'
                  if name=='eslint':
                      selector='eslint@^8'
                  if name in ('react','react-dom'):
                      selector=name+'@^19'
                  version=json.loads(subprocess.check_output(['npm','view',selector,'version','--json'],text=True))
                  if isinstance(version,list):
                      version=version[-1]
                  if not isinstance(version,str) or not version:
                      raise ValueError(f'Invalid version for {name}: {version!r}')
                  report[name]={'before':old,'candidate':version,'selector':selector}
                  d[section][name]=version
          if os.environ['SCOPE']=='core':
              # Next 16 needs React 18+; keep React and React DOM aligned in core trial.
              for n in ('react','react-dom'):
                  if n not in report:
                      raise ValueError(f'{n} missing in core trial')
          Path('modernization-report/versions.json').write_text(json.dumps(report,indent=2))
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Strict peer compatibility check
        id: strict
        continue-on-error: true
        run: |
          set -o pipefail
          rm -f package-lock.json
          npm install --no-audit --package-lock-only 2>&1 | tee modernization-report/strict-install.log
      - name: Diagnostic install only - never publish this candidate
        if: steps.strict.outcome == 'failure'
        run: |
          set -o pipefail
          echo "Unresolved peer dependencies: diagnostic mode only; not deployable" | tee modernization-report/UNSAFE-DIAGNOSTIC.txt
          npm install --no-audit --legacy-peer-deps 2>&1 | tee modernization-report/diagnostic-install.log
      - name: Install strictly compatible candidate
        if: steps.strict.outcome == 'success'
        run: |
          set -o pipefail
          npm ci --no-audit 2>&1 | tee modernization-report/install.log
      - name: Report peer incompatibilities
        if: always()
        run: |
          if [ -f modernization-report/strict-install.log ]; then
            grep -E 'npm error (Could not resolve dependency|Conflicting peer dependency|peer |must provide string spec|ERESOLVE)' modernization-report/strict-install.log | head -60 || true
          fi
      - name: Audit candidate
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name,flags in [('all',[]),('production',['--omit=dev'])]:
              r=subprocess.run(['npm','audit','--json',*flags],capture_output=True,text=True)
              Path('modernization-report/'+name+'.json').write_text(r.stdout)
              print(name,json.loads(r.stdout)['metadata']['vulnerabilities'])
          PY
      - run: npm run verify:locales
      - name: Production build
        run: npm run build
      - name: Reject diagnostic candidate as deployable
        if: steps.strict.outcome == 'failure'
        run: |
          echo "::error::Strict peer dependency resolution failed. Diagnostic-only candidate cannot be released."
          exit 1
      - name: Verify source and assets unchanged
        run: git diff --exit-code -- src public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernization-${{ matrix.scope }}-${{ matrix.node }}
          path: |
            modernization-report/
            package.json
            package-lock.json
